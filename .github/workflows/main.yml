name: main

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Build
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet pack dotnet-packaging.sln -c Release -o pkg/
          cp demo/Directory.Build.props pkg/
          cp demo/version.txt pkg/

      - name: Unit Test
        run: |
          dotnet test Packaging.Targets.Tests/Packaging.Targets.Tests.csproj -l "trx;LogFileName=pkg/Packaging.Targets.Tests.trx"

      - name: Integration Test - Build Packages
        run: |
          set -e
          export PATH="$PATH:/$HOME/.dotnet/tools"

          cd demo

          version=$(cat version.txt)

          # Install the dotnet-${{ matrix. command }} tool
          dotnet tool install --global dotnet-deb --version $version
          dotnet tool install --global dotnet-rpm --version $version
          dotnet tool install --global dotnet-zip --version $version
          dotnet tool install --global dotnet-tarball --version $version

          # Use dotnet-packaging
          dotnet deb self-contained-app/self-contained-app.csproj -o ${{ github.workspace }}/pkg/deb
          dotnet rpm self-contained-app/self-contained-app.csproj -o ${{ github.workspace }}/pkg/rpm
          dotnet zip self-contained-app/self-contained-app.csproj -o ${{ github.workspace }}/pkg/zip
          dotnet tarball self-contained-app/self-contained-app.csproj -o ${{ github.workspace }}/pkg/tarball

      # Install the .deb and .rpm packages (for self-contained apps) in a
      # Ubuntu and RHEL Docker container.
      # The self-contained app is a xunit test suite, which ensures the app
      # is installed correctly.
      - name: Integration Test - Install Packages
        run: |
          set -e
          export PATH="$PATH:/$HOME/.dotnet/tools"

          # Test a rpm-based build
          ./run-tests.sh -r rhel.10-x64

          # Test a deb-based build
          ./run-tests.sh -r ubuntu.26.04-x64
        working-directory: demo/self-contained-app
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: pkg
          path: pkg/

  publish:
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Build
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet pack dotnet-packaging.sln -c Release -o pkg/

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: qmfrederik
    
      # Push to NuGet (master only)
      - name: NuGet push
        run: |
          dotnet nuget push pkg/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
          dotnet nuget push pkg/*.snupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
